name: HomeDoc AI - iOS Simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: HomeDoc unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test offline and optional-AI validation logic
        run: node --test homedoc/tests/*.test.mjs homedoc/server/*.test.mjs

  ios-simulator:
    name: Compile unsigned iOS Simulator app
    needs: tests
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      APP_ID: dev.babahadjsaid.homedocai
      APP_BUILD_PATH: build/homedoc
      APP_RESOURCES: App_Resources/documentscanner
      PROJECT_NAME: homedoc
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
      CI: 'true'
    steps:
      - name: Checkout source and upstream submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show Apple build environment
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          node --version
      - name: Enable Yarn 4 / Corepack
        run: |
          corepack enable
          yarn --version
      - name: Install upstream-compatible NativeScript CLI
        run: |
          npm install --global @akylas/nativescript-cli --ignore-scripts --legacy-peer-deps
          ns package-manager set yarn2
          ns --version
      - name: Install app dependencies
        run: yarn install --no-immutable
      - name: Download original scanner native OCR frameworks
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            https://github.com/ossappscollective/OSS-DocumentScanner/releases/download/dev_resources/ios.zip \
            --output /tmp/homedoc-ios-frameworks.zip
          unzip -o -q /tmp/homedoc-ios-frameworks.zip -d .
          du -sh opencv/ios tesseract/ios
      - name: Build HomeDoc iOS Simulator app (no signing)
        run: |
          ns build ios --env.devlog
      - name: Package simulator-only application
        run: |
          mkdir -p dist
          find . -type d -path '*iphonesimulator*' -name '*.app' -print
          APP_PATH="$(find build -type d -path '*iphonesimulator*' -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "iOS Simulator .app not found after NativeScript build."
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/HomeDocAI-Simulator.zip
          ls -lh dist/HomeDocAI-Simulator.zip
      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: HomeDocAI-iOS-Simulator
          path: dist/HomeDocAI-Simulator.zip
          if-no-files-found: error
          retention-days: 7
